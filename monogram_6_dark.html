<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BFi-Monogramm</title>
  <style>
    /* ============================================================
       JUSTIEREN – Farben (hier musst du nur die Werte ändern)
       ============================================================ */
    :root {
	--bg-oben:   #1f242b;   /* etwas hellerer Badge-Hintergrund */
--bg-unten:  #87898d;
--bfi-deckkraft: 0.6;   /* Buchstaben durchlässiger */
--fbi-farbe: #5e646d;  /* Wasserzeichen einen Tick deutlicher */

      --bfi:       #fafbfd;   /* Farbe der Buchstaben B F ı            */
       --bronze-a:  #dcb269;   /* Bronze, hell (i-Punkt & Linien)       */
      --bronze-b:  #8c6a25;   /* Bronze, dunkel (i-Punkt & Linien)     */
                                    dunkler = blasser (voll deckend)      */
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    /* ============================================================
       JUSTIEREN – Größe & Zoom-Verhalten
       ============================================================
       min(80vmin, 480px) heißt:
         - 80 % der kleineren Fensterseite (reagiert aufs Fenster)
         - aber nie breiter als 480px
       Alternativen:
         width: 400px;            -> feste Breite
         width: 50%;              -> die Hälfte des Fensters
    */
    .badge {
      width: min(100%, 480px);   /* statt min(80vmin, 480px) */
      height: auto;
      display: block;
    }

    /* Farben aus den Variablen oben in die SVG-Verläufe leiten */
    .stop-bg-oben  { stop-color: var(--bg-oben); }
    .stop-bg-unten { stop-color: var(--bg-unten); }
    .stop-bronze-a { stop-color: var(--bronze-a); }
    .stop-bronze-b { stop-color: var(--bronze-b); }
    .bfi-fill      { fill: var(--bfi); opacity: var(--bfi-deckkraft); }
    .fbi-wm        { fill: var(--fbi-farbe); }
  </style>
</head>
<body>

  <!-- WICHTIG für Zoom/Skalierung:
       - viewBox="0 0 400 306" MUSS bleiben (das ist der Maßstab)
       - KEIN festes width/height-Attribut im <svg>-Tag selbst
       - Alle Koordinaten sind "interne" Einheiten der viewBox -->
  <svg class="badge" viewBox="0 0 400 306" role="img" aria-label="Monogramm BFi">
    <defs>
      <radialGradient id="bg" cx="50%" cy="35%" r="85%">
        <stop class="stop-bg-oben" offset="0%" />
        <stop class="stop-bg-unten" offset="100%" />
      </radialGradient>

      <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
        <stop class="stop-bronze-a" offset="0%" />
        <stop class="stop-bronze-b" offset="100%" />
      </linearGradient>

      <!-- JUSTIEREN: stdDeviation = Weichzeichnung des Schattens -->
      <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="2.5" />
      </filter>
    </defs>

    <!-- Badge-Fläche. JUSTIEREN: rx="36" = Rundung der Ecken.
         Innenabstand ringsum: 49 Einheiten. Wenn du Inhalte verschiebst,
         verschiebe sie alle gemeinsam und passe die Höhe an:
         Höhe = 49 + Abstand oberste Linie bis unterste Linie + 49 -->
    <rect width="400" height="306" rx="36" fill="url(#bg)" />
    <rect x="10" y="10" width="380" height="286" rx="28" fill="none"
          stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.5" />
    <rect x="19" y="19" width="362" height="268" rx="22" fill="none"
          stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />

    <g text-anchor="middle"
       font-family="'Arial Black','Arial Bold',Arial,Helvetica,sans-serif"
       font-weight="900">
      <!-- FBI-Wasserzeichen. JUSTIEREN: y = Höhe, font-size = Größe,
           Farbe über --fbi-farbe oben im <style> (heller = deutlicher) -->
      <text class="fbi-wm" x="200" y="182" font-size="140" letter-spacing="15"
            stroke="#7a818b" stroke-width="1.5">FBI</text>

      <!-- Schatten. JUSTIEREN: x/y = Versatz nach rechts/unten (Vordergrund: 200/225),
           opacity = Schattenstärke -->
      <text x="207" y="232" font-size="165" fill="#05070a" opacity="0.6" filter="url(#soft)">BFı</text>

      <!-- Vordergrund: BFi (punktloses i), Durchlässigkeit über --bfi-deckkraft -->
      <text class="bfi-fill" x="200" y="225" font-size="165">BFı</text>
    </g>

    <!-- JUSTIEREN: bronzener i-Punkt. cx = horizontal über dem ı-Balken
         (bei anderer Schriftart eventuell etwas anpassen), cy = Höhe, r = Größe -->
    <circle cx="320" cy="119" r="13.5" fill="url(#bronze)" />

    <!-- JUSTIEREN: Akzentlinien. y = Höhe, x/width = Anfang & Länge,
         height = Strichstärke -->
    <rect x="92" y="49" width="216" height="6" rx="3" fill="url(#bronze)" />
    <rect x="92" y="251" width="216" height="6" rx="3" fill="url(#bronze)" />
  </svg>

</body>
</html>
